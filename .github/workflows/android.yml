name: Build Android (local no runner Ubuntu)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restaurar keystore de upload (dos secrets)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p secrets
          echo "$KEYSTORE" | base64 -d > secrets/upload-keystore.jks
          cat > mobile/credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "../secrets/upload-keystore.jks",
                "keystorePassword": "$STOREPASS",
                "keyAlias": "$ALIAS",
                "keyPassword": "$KEYPASS"
              }
            }
          }
          EOF
          echo "Keystore restaurado."

      - name: Instalar dependencias
        working-directory: mobile
        run: npm install

      - name: Instalar eas-cli
        run: npm install -g eas-cli

      - name: Build AAB (local, sem cota EAS nuvem)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --platform android --profile production --non-interactive --output "$GITHUB_WORKSPACE/app.aab"

      - name: Upload do AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: app.aab
