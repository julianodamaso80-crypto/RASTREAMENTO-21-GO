services:
  postgres:
    image: postgres:16-alpine
    container_name: r21go-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rastreamento21go
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: r21go-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  traccar:
    image: traccar/traccar:6.14.5
    container_name: r21go-traccar
    environment:
      # Heap default ~256m derruba com >100 devices.
      # 1500m suporta confortavelmente até alguns milhares; em prod (Fase 3)
      # subir pra 4g num droplet dedicado.
      JAVA_OPTS: "-Xms512m -Xmx1500m -Duser.timezone=America/Sao_Paulo"
      TZ: America/Sao_Paulo
    ports:
      - "8082:8082"
      - "5055:5055/tcp"
      - "5055:5055/udp"
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_data:/opt/traccar/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/api/server > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  geocoder:
    # Pinado em 1.0.8 (mesmo digest de :latest em 21/08/2026, conferido em
    # hub.docker.com) — o backend depende do formato de resposta desta
    # versão (sem ISO3166-2-lvl4, key como query param); :latest podia trocar
    # isso silenciosamente num redeploy.
    image: traccar/traccar-geocoder:1.0.8
    container_name: r21go-geocoder
    environment:
      # Extrato do Brasil por padrão (Geofabrik). Pra teste local rápido, use
      # um extrato pequeno, ex.: GEOCODER_PBF_URLS=https://download.geofabrik.de/europe/monaco-latest.osm.pbf
      # (build em ~90s, contra horas pro Brasil inteiro — ver docs/RUNBOOK-GEOCODER.md).
      PBF_URLS: ${GEOCODER_PBF_URLS:-https://download.geofabrik.de/south-america/brazil-latest.osm.pbf}
    ports:
      # Publicado só pro dev abrir o navegador e criar a conta admin +
      # gerar o token (POST /login, POST /tokens) — sem porta aberta isso só
      # dá pra fazer via `docker exec` + curl. Em produção o backend fala com
      # o geocoder pela rede interna do Docker Swarm, sem publicar porta
      # nenhuma (ver docs/RUNBOOK-GEOCODER.md, seção "Criar o admin antes de
      # a porta ficar acessível" — o primeiro /login que chegar vira dono).
      # Diferente de postgres/traccar acima: aqui o primeiro login cria o
      # admin (sem senha padrão), então quem chega primeiro na porta vira
      # dono do serviço. Bind só em localhost — o backend já fala com o
      # geocoder pela rede interna do Docker, ninguém fora da máquina precisa
      # dessa porta.
      - "127.0.0.1:3011:3000"
    volumes:
      - geocoder_data:/data
    networks:
      - app-network
    healthcheck:
      # Esta imagem (Debian bookworm) não tem wget — só curl. wget aqui
      # deixaria o container permanentemente "unhealthy" (confirmado rodando
      # a imagem: `which wget` falha, `which curl` acha /usr/bin/curl).
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/login > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: r21go-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - traccar
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  traccar_data:
  geocoder_data:

networks:
  app-network:
    driver: bridge
